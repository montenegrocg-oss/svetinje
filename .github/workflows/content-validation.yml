name: Content validation

on:
  pull_request:
    paths:
      - "content/**"
      - "schemas/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "validation/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/content-validation.yml"
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "schemas/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "validation/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/content-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate schemas and content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Verify tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation, tests, and type checks
        run: pnpm run check

      - name: Build and inspect static output
        run: pnpm run build
